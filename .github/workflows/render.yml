name: Render video

on:
  workflow_dispatch:
  push:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Render
        run: npm run render

      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: admission-calendar-video
          path: out/video.mp4
          retention-days: 14
